<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">How a Review Ready scan works</title>
  <desc id="desc">The scan reads app.json, Info.plist, AndroidManifest.xml, package.json and eas.json, fans out to five parallel auditors (privacy, IAP and business, permissions, metadata, crash risk), and produces one severity-ranked report. The fix command then applies the safe fixes.</desc>

  <rect width="1200" height="430" rx="28" fill="#0B1A22"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="64" fill="#7FA0AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">/review-ready:scan</text>

    <g id="inputs" transform="translate(64 96)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#DCE8EC">
      <rect width="260" height="270" rx="18" fill="#0F2530" stroke="#1F3A47" stroke-width="1.5"/>
      <text x="24" y="44" fill="#7FA0AD" font-size="18">your project</text>
      <text x="24" y="92">app.json</text>
      <text x="24" y="132">Info.plist</text>
      <text x="24" y="172">AndroidManifest</text>
      <text x="24" y="212">package.json</text>
      <text x="24" y="252">eas.json</text>
    </g>

    <g id="fan-out" fill="none" stroke="#2A5563" stroke-width="2">
      <path d="M324 231 C 370 231, 370 120, 416 120"/>
      <path d="M324 231 C 370 231, 370 175, 416 175"/>
      <path d="M324 231 L 416 231"/>
      <path d="M324 231 C 370 231, 370 287, 416 287"/>
      <path d="M324 231 C 370 231, 370 342, 416 342"/>
    </g>

    <g id="auditors" font-size="21" font-weight="600" fill="#F2F7F8">
      <g transform="translate(416 98)"><rect width="300" height="44" rx="12" fill="#12303B"/><text x="20" y="29">privacy</text><text x="282" y="29" text-anchor="end" fill="#7FA0AD" font-size="18" font-weight="400" font-family="ui-monospace, Menlo, monospace">5.1 · ATT</text></g>
      <g transform="translate(416 153)"><rect width="300" height="44" rx="12" fill="#12303B"/><text x="20" y="29">IAP &amp; business</text><text x="282" y="29" text-anchor="end" fill="#7FA0AD" font-size="18" font-weight="400" font-family="ui-monospace, Menlo, monospace">3.1 · 3.2</text></g>
      <g transform="translate(416 209)"><rect width="300" height="44" rx="12" fill="#12303B"/><text x="20" y="29">permissions</text><text x="282" y="29" text-anchor="end" fill="#7FA0AD" font-size="18" font-weight="400" font-family="ui-monospace, Menlo, monospace">§8 · FGS</text></g>
      <g transform="translate(416 265)"><rect width="300" height="44" rx="12" fill="#12303B"/><text x="20" y="29">metadata</text><text x="282" y="29" text-anchor="end" fill="#7FA0AD" font-size="18" font-weight="400" font-family="ui-monospace, Menlo, monospace">4.8 · SDK</text></g>
      <g transform="translate(416 320)"><rect width="300" height="44" rx="12" fill="#12303B"/><text x="20" y="29">crash risk</text><text x="282" y="29" text-anchor="end" fill="#7FA0AD" font-size="18" font-weight="400" font-family="ui-monospace, Menlo, monospace">2.1 · 4.2</text></g>
    </g>

    <g id="fan-in" fill="none" stroke="#2A5563" stroke-width="2">
      <path d="M716 120 C 762 120, 762 231, 808 231"/>
      <path d="M716 175 C 762 175, 762 231, 808 231"/>
      <path d="M716 231 L 808 231"/>
      <path d="M716 287 C 762 287, 762 231, 808 231"/>
      <path d="M716 342 C 762 342, 762 231, 808 231"/>
    </g>

    <g id="report" transform="translate(808 96)">
      <rect width="328" height="270" rx="18" fill="#0F2530" stroke="#1F3A47" stroke-width="1.5"/>
      <text x="24" y="44" fill="#7FA0AD" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one ranked report</text>
      <g font-size="21" font-weight="600">
        <circle cx="32" cy="85" r="7" fill="#FF6B70"/><text x="50" y="92" fill="#F2F7F8">Blockers</text>
        <circle cx="32" cy="125" r="7" fill="#F6B550"/><text x="50" y="132" fill="#F2F7F8">High</text>
        <circle cx="32" cy="165" r="7" fill="#5B9BF0"/><text x="50" y="172" fill="#F2F7F8">Medium · Info</text>
      </g>
      <line x1="24" y1="198" x2="304" y2="198" stroke="#1F3A47" stroke-width="1.5" stroke-dasharray="4 6"/>
      <text x="24" y="238" fill="#7BE3A3" font-size="20" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/review-ready:fix</text>
    </g>

    <text x="1136" y="400" text-anchor="end" fill="#7FA0AD" font-size="18">file:line, guideline number and a fix on every finding</text>
  </g>
</svg>
